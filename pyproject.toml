[project]
name = "omni-harness"
version = "0.1.0"
description = "Universal agentic harness combining Pi, Hermes, and OpenClaw architectures with drop-in plugin compatibility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
]

[project.scripts]
omni = "src.cli:main"
